<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Scoreboard Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #000; --white: #fff; --gray: #666; --dim: #333; }
    html { height: 100%; }
    body { background: var(--black); color: var(--white); font-family: 'Space Grotesk', sans-serif; min-height: 100%; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.875rem 1.25rem; background: var(--black);
      border-bottom: 1px solid var(--white); height: 52px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.25em;
    }

    main { padding-top: 52px; }
    .screen { display: flex; flex-direction: column; min-height: calc(100vh - 52px); padding: 1.75rem 1.25rem 2rem; }
    @media (min-width: 640px) { .screen { max-width: 560px; margin: 0 auto; } }

    .t-large { font-size: clamp(1.4rem, 6vw, 2.5rem); font-weight: 700; line-height: 1.05; text-transform: uppercase; }
    .t-small { font-size: 0.8rem; font-weight: 400; }
    .gray { color: var(--gray); }
    .mt-1 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 2rem; }
    hr { border: none; border-top: 1px solid var(--white); margin: 1.5rem 0; }
    .spacer { flex: 1; }

    #sb-winner { margin-bottom: 1.5rem; }
    #sb-winner-name {
      font-size: clamp(2.5rem, 14vw, 6rem);
      font-weight: 900; text-transform: uppercase;
      letter-spacing: -0.03em; line-height: 1; word-break: break-word;
    }
    #sb-winner-line { font-size: clamp(0.8rem, 2.5vw, 0.95rem); font-weight: 400; color: var(--gray); margin-top: 0.625rem; line-height: 1.5; }

    .score-row { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--dim); padding: 1rem 0; }
    .score-rank { font-size: 1rem; font-weight: 700; color: var(--gray); width: 1.5rem; flex-shrink: 0; }
    .score-name { flex: 1; font-size: clamp(1rem, 5vw, 1.5rem); font-weight: 700; text-transform: uppercase; }
    .score-stat { text-align: right; flex-shrink: 0; }
    .score-wins { font-size: 1.5rem; font-weight: 900; }
    .score-label { font-size: 0.65rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.1em; }

    .btn { display: block; width: 100%; font-family: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 0; text-align: center; border: 2px solid var(--white); }
    .btn-fill { background: var(--white); color: var(--black); font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 1.1rem 1rem; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab { flex: 1; background: none; border: 1px solid var(--dim); color: var(--gray); font-family: inherit; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.4rem; cursor: pointer; border-radius: 0; }
    .tab.active { border-color: var(--white); color: var(--white); }
  </style>
</head>
<body>

<div id="topbar">
  <span>◐ CONTRARIAN</span>
  <span style="color:var(--gray); font-size:0.65rem;">ES &nbsp; MUTE</span>
</div>

<main>

  <!-- ─── WITH PLAYERS ─── -->
  <section class="screen" id="with-players">
    <div>
      <h2 class="t-large">SCOREBOARD</h2>
      <p class="t-small gray mt-1">Who convinced the most?</p>
    </div>
    <hr>

    <div class="tabs">
      <button class="tab active" onclick="showTab('with-players')">WITH PLAYERS</button>
      <button class="tab" onclick="showTab('no-players')">NO PLAYERS</button>
    </div>

    <div id="sb-winner">
      <div id="sb-winner-name">MARIANA</div>
      <p id="sb-winner-line">Most convincing person in the room. Terrifying.</p>
    </div>

    <div>
      <div class="score-row">
        <div class="score-rank">1</div>
        <div class="score-name">Mariana</div>
        <div class="score-stat"><div class="score-wins">4/5</div><div class="score-label">convinced</div></div>
      </div>
      <div class="score-row">
        <div class="score-rank">2</div>
        <div class="score-name">Carlos</div>
        <div class="score-stat"><div class="score-wins">3/5</div><div class="score-label">convinced</div></div>
      </div>
      <div class="score-row">
        <div class="score-rank">3</div>
        <div class="score-name">Sofía</div>
        <div class="score-stat"><div class="score-wins">2/5</div><div class="score-label">convinced</div></div>
      </div>
      <div class="score-row">
        <div class="score-rank">4</div>
        <div class="score-name">Rodrigo</div>
        <div class="score-stat"><div class="score-wins">1/5</div><div class="score-label">convinced</div></div>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-fill mt-4">PLAY AGAIN</button>
  </section>

  <!-- ─── NO PLAYERS ─── -->
  <section class="screen" id="no-players" style="display:none;">
    <div>
      <h2 class="t-large">SCOREBOARD</h2>
      <p class="t-small gray mt-1">Who convinced the most?</p>
    </div>
    <hr>

    <div class="tabs">
      <button class="tab" onclick="showTab('with-players')">WITH PLAYERS</button>
      <button class="tab active" onclick="showTab('no-players')">NO PLAYERS</button>
    </div>

    <div class="score-row">
      <div class="score-name">SESSION</div>
      <div class="score-stat"><div class="score-wins">7/10</div><div class="score-label">rounds convinced</div></div>
    </div>

    <div class="spacer"></div>
    <button class="btn btn-fill mt-4">PLAY AGAIN</button>
  </section>

</main>

<script>
  function showTab(id) {
    ['with-players', 'no-players'].forEach(s => {
      document.getElementById(s).style.display = s === id ? 'flex' : 'none';
    });
  }
</script>
</body>
</html>
