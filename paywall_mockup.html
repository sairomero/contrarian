<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Paywall Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #000; --white: #fff; --gray: #666; --dim: #333; }
    html { height: 100%; }
    body { background: var(--black); color: var(--white); font-family: 'Space Grotesk', sans-serif; min-height: 100%; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.875rem 1.25rem;
      background: var(--black); border-bottom: 1px solid var(--white);
      height: 52px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.25em;
    }
    .topbar-controls { display: flex; gap: 0.625rem; }
    .ctrl-btn {
      background: none; border: 1px solid var(--white); color: var(--white);
      font-family: inherit; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em;
      padding: 0.3rem 0.625rem; cursor: pointer; text-transform: uppercase; border-radius: 0;
    }
    .ctrl-btn:hover { background: var(--white); color: var(--black); }
    .ctrl-btn.active { background: var(--white); color: var(--black); }

    main { padding-top: 52px; }
    .screen {
      display: flex; flex-direction: column;
      min-height: calc(100vh - 52px);
      padding: 1.75rem 1.25rem 2rem;
    }
    @media (min-width: 640px) { .screen { max-width: 560px; margin: 0 auto; } }

    .t-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); }
    .t-medium { font-size: clamp(1rem, 4vw, 1.375rem); font-weight: 500; }
    .mt-2 { margin-top: 1rem; }
    .mt-4 { margin-top: 2rem; }

    .paywall-top h2 {
      font-size: clamp(2.5rem, 14vw, 7rem); font-weight: 900;
      text-transform: uppercase; line-height: 0.92; white-space: pre-line;
    }

    .price-card { border: 1px solid var(--white); padding: 1.25rem; margin-bottom: 0.75rem; }
    .price-card h3 { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.5rem; }
    .price-main { font-size: clamp(1.5rem, 7vw, 2.25rem); font-weight: 900; }
    .price-alt { font-size: 0.85rem; color: var(--gray); margin-left: 0.375rem; }
    .price-btn { margin-top: 0.875rem; }
    .pw-feature { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--white); margin-top: 0.5rem; }

    .btn { display: block; width: 100%; font-family: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 0; text-align: center; border: 2px solid var(--white); }
    .btn-fill { background: var(--white); color: var(--black); font-size: clamp(0.9rem, 3vw, 1.1rem); padding: 1.1rem 1rem; }
    .btn-fill:hover { background: transparent; color: var(--white); }
    .btn-ghost { background: none; border: none; color: var(--gray); font-family: inherit; font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0.5rem 0; text-align: center; width: 100%; }
    .btn-ghost:hover { color: var(--white); }

    .pw-custom-section { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--dim); }
    .pw-custom-title { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.75rem; }
    .pw-custom-body { font-size: 0.85rem; font-weight: 400; line-height: 1.7; color: var(--gray); }
    .pw-custom-body em { font-style: italic; color: var(--white); }
  </style>
</head>
<body>

<div id="topbar">
  <span>◐ CONTRARIAN</span>
  <div class="topbar-controls">
    <button class="ctrl-btn" id="lang-btn" onclick="toggleLang()">ES</button>
    <button class="ctrl-btn">MUTE</button>
  </div>
</div>

<main>
<section class="screen" id="screen-paywall">

  <div class="paywall-top">
    <p class="t-label" id="pw-rounds">10 OF 10 FREE ROUNDS USED</p>
    <h2 class="mt-2" id="pw-headline">KEEP<br>PLAYING.</h2>
    <p class="t-medium mt-2" id="pw-sub">Unlock unlimited rounds for your group.</p>
  </div>

  <div class="mt-4">
    <div class="price-card">
      <h3 id="pw-24h">24-HOUR GROUP PASS</h3>
      <div>
        <span class="price-main">$5 USD</span>
        <span class="price-alt">/ $90 MXN</span>
      </div>
      <button class="btn btn-fill price-btn" id="btn-24h">GET 24H PASS</button>
    </div>

    <div class="price-card">
      <h3 id="pw-weekly">WEEKLY PASS</h3>
      <div>
        <span class="price-main">$18 USD</span>
        <span class="price-alt">/ $320 MXN</span>
      </div>
      <button class="btn btn-fill price-btn" id="btn-weekly">GET WEEKLY PASS</button>
    </div>

    <div class="price-card">
      <h3 id="pw-monthly">MONTHLY PASS</h3>
      <div>
        <span class="price-main">$45 USD</span>
        <span class="price-alt">/ $800 MXN</span>
      </div>
      <p class="pw-feature" id="pw-feature">+ Custom topics. Build your own game.</p>
      <button class="btn btn-fill price-btn" id="btn-monthly">GET MONTHLY PASS</button>
    </div>
  </div>

  <div class="pw-custom-section">
    <p class="pw-custom-title" id="custom-title">WHAT CAN YOU DO WITH CUSTOM TOPICS?</p>
    <p class="pw-custom-body" id="custom-body"></p>
  </div>

  <button class="btn-ghost" id="btn-back" style="margin-top:1rem;">← Back to home</button>

</section>
</main>

<script>
  const copy = {
    en: {
      rounds: '10 OF 10 FREE ROUNDS USED',
      headline: 'KEEP\nPLAYING.',
      sub: 'Unlock unlimited rounds for your group.',
      c24h: '24-HOUR GROUP PASS', btn24h: 'GET 24H PASS',
      weekly: 'WEEKLY PASS', btnWeekly: 'GET WEEKLY PASS',
      monthly: 'MONTHLY PASS', btnMonthly: 'GET MONTHLY PASS',
      feature: '+ Custom topics. Build your own game.',
      customTitle: 'WHAT CAN YOU DO WITH CUSTOM TOPICS?',
      customBody: "The monthly plan unlocks Custom Topics, your own topics, built exactly the way you need them. A law professor can turn the game into a live case study exercise: <em>'Defend the defendant in State v. Morrison.'</em> A group of friends can make it devastatingly personal: <em>'Argue that Carlos was right to ghost Ana,'</em> or <em>'Defend the time Diego showed up two hours late to his own birthday.'</em> A therapist can use it to explore difficult conversations in a low-stakes setting. A team lead can build a culture exercise out of real workplace dilemmas. The game stays the same. The chaos becomes yours.",
      back: '← Back to home',
    },
    es: {
      rounds: '10 DE 10 RONDAS GRATUITAS USADAS',
      headline: 'SIGUE\nJUGANDO.',
      sub: 'Desbloquea rondas ilimitadas para tu grupo.',
      c24h: 'PASE GRUPAL 24 HORAS', btn24h: 'OBTENER PASE 24H',
      weekly: 'PASE SEMANAL', btnWeekly: 'OBTENER PASE SEMANAL',
      monthly: 'PASE MENSUAL', btnMonthly: 'OBTENER PASE MENSUAL',
      feature: '+ Temas personalizados. Haz tu propio juego.',
      customTitle: '¿QUÉ PUEDES HACER CON LOS TEMAS PERSONALIZADOS?',
      customBody: "El plan mensual desbloquea los Temas Personalizados, tus propios temas, construidos exactamente como los necesitas. Un profesor de derecho puede convertir el juego en un ejercicio de casos en vivo: <em>'Defiende al acusado en el caso González vs. Estado.'</em> Un grupo de amigos puede hacerlo devastadoramente personal: <em>'Argumenta que Carlos tenía razón de ghostear a Ana,'</em> o <em>'Defiende la vez que Diego llegó dos horas tarde a su propio cumpleaños.'</em> Una terapeuta puede usarlo para explorar conversaciones difíciles en un contexto de bajo riesgo. Un líder de equipo puede construir un ejercicio de cultura organizacional con dilemas reales de la oficina. El juego sigue siendo el mismo. El caos se vuelve tuyo.",
      back: '← Volver al inicio',
    }
  };

  let lang = 'en';

  function render() {
    const t = copy[lang];
    document.getElementById('pw-rounds').textContent = t.rounds;
    document.getElementById('pw-headline').innerHTML = t.headline.replace('\n', '<br>');
    document.getElementById('pw-sub').textContent = t.sub;
    document.getElementById('pw-24h').textContent = t.c24h;
    document.getElementById('btn-24h').textContent = t.btn24h;
    document.getElementById('pw-weekly').textContent = t.weekly;
    document.getElementById('btn-weekly').textContent = t.btnWeekly;
    document.getElementById('pw-monthly').textContent = t.monthly;
    document.getElementById('btn-monthly').textContent = t.btnMonthly;
    document.getElementById('pw-feature').textContent = t.feature;
    document.getElementById('custom-title').textContent = t.customTitle;
    document.getElementById('custom-body').innerHTML = t.customBody;
    document.getElementById('btn-back').textContent = t.back;
    document.getElementById('lang-btn').textContent = lang === 'en' ? 'ES' : 'EN';
  }

  function toggleLang() {
    lang = lang === 'en' ? 'es' : 'en';
    render();
  }

  render();
</script>
</body>
</html>
